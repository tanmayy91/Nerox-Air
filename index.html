<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexaMusic Lite</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>NexaMusic Lite</h1>
      <p class="subtitle">A lightweight web music player.</p>

      <section class="player">
        <h2 id="track-title">Select a track</h2>
        <audio id="audio-player" controls preload="none"></audio>
      </section>

      <section>
        <h3>Tracks</h3>
        <ul id="track-list" class="track-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
